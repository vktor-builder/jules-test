<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Price Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .chart-container {
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <h2 style="text-align: center;">Bitcoin Price (Last 30 Days)</h2>
        <canvas id="bitcoinChart"></canvas>
    </div>

    <script>
        async function fetchBitcoinData() {
            try {
                // Fetching Bitcoin historical market chart data for the last 30 days
                const response = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=30&interval=daily');
                const data = await response.json();

                // Extracting labels (dates) and data (prices)
                const prices = data.prices;
                const labels = prices.map(price => {
                    const date = new Date(price[0]);
                    return `${date.getMonth() + 1}/${date.getDate()}`;
                });
                const dataPoints = prices.map(price => price[1]);

                renderChart(labels, dataPoints);
            } catch (error) {
                console.error('Error fetching Bitcoin data:', error);
                alert('Failed to fetch data. Check console for details.');
            }
        }

        function renderChart(labels, data) {
            const ctx = document.getElementById('bitcoinChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Bitcoin Price (USD)',
                        data: data,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: 'rgba(75, 192, 192, 1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Price (USD)'
                            },
                            beginAtZero: false
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        // Initialize the fetch and chart rendering
        fetchBitcoinData();
    </script>

</body>
</html>
