<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .controls {
            margin-bottom: 20px;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
        }
        .chart-container {
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="timeframeSelector"><strong>Select Timeframe: </strong></label>
        <select id="timeframeSelector">
            <option value="7">Last 7 Days</option>
            <option value="30" selected>Last 30 Days</option>
            <option value="90">Last 90 Days</option>
        </select>
    </div>

    <div class="chart-container">
        <h2 id="bitcoinTitle" style="text-align: center;">Bitcoin Price (Last 30 Days)</h2>
        <canvas id="bitcoinChart"></canvas>
    </div>

    <div class="chart-container">
        <h2 id="ethereumTitle" style="text-align: center;">Ethereum Price (Last 30 Days)</h2>
        <canvas id="ethereumChart"></canvas>
    </div>

    <script>
        let charts = {};

        async function fetchCryptoData(coinId, canvasId, label, borderColor, backgroundColor, days) {
            try {
                // Fetching historical market chart data for the selected days
                const response = await fetch(`https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}&interval=daily`);
                const data = await response.json();

                // Extracting labels (dates) and data (prices)
                const prices = data.prices;
                const labels = prices.map(price => {
                    const date = new Date(price[0]);
                    return `${date.getMonth() + 1}/${date.getDate()}`;
                });
                const dataPoints = prices.map(price => price[1]);

                renderChart(canvasId, labels, dataPoints, label, borderColor, backgroundColor);
            } catch (error) {
                console.error(`Error fetching ${coinId} data:`, error);
            }
        }

        function renderChart(canvasId, labels, data, datasetLabel, borderColor, backgroundColor) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            // Destroy existing chart if it exists to prevent overlap
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: datasetLabel,
                        data: data,
                        borderColor: borderColor,
                        backgroundColor: backgroundColor,
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: borderColor,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Price (USD)'
                            },
                            beginAtZero: false
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateCharts() {
            const selector = document.getElementById('timeframeSelector');
            const days = selector.value;

            // Update Titles
            document.getElementById('bitcoinTitle').innerText = `Bitcoin Price (Last ${days} Days)`;
            document.getElementById('ethereumTitle').innerText = `Ethereum Price (Last ${days} Days)`;

            // Fetch and Render
            fetchCryptoData('bitcoin', 'bitcoinChart', 'Bitcoin Price (USD)', 'rgba(247, 147, 26, 1)', 'rgba(247, 147, 26, 0.2)', days);
            fetchCryptoData('ethereum', 'ethereumChart', 'Ethereum Price (USD)', 'rgba(98, 126, 234, 1)', 'rgba(98, 126, 234, 0.2)', days);
        }

        // Event listener for dropdown change
        document.getElementById('timeframeSelector').addEventListener('change', updateCharts);

        // Initial render
        updateCharts();
    </script>

</body>
</html>
